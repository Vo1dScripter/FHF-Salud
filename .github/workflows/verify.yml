name: Verificar proyecto
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: npm ci
      - run: npm run verify

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker pull postgres:17-alpine
      - run: python scripts/tar05/verify-database.py
        env:
          CONTAINER_ENGINE: docker
      - name: Integridad y seguridad PRY07
        run: python scripts/pry07/verify-integrity-security.py
        env:
          CONTAINER_ENGINE: docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pry07-integridad-seguridad
          path: evidencias/PRY07/02-emilio
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Instalar Chromium de pruebas
        run: |
          npm install --prefix "$RUNNER_TEMP/fhf-playwright" --no-audit --no-fund playwright@1.65.1
          "$RUNNER_TEMP/fhf-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - run: python3 -m unittest discover -s scripts/pry07
      - name: E2E local con Auth y PostgreSQL
        run: python3 -u scripts/pry07/local-e2e.py
        env:
          CONTAINER_ENGINE: docker
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/fhf-playwright/node_modules/playwright/index.mjs
          PRY07_E2E_OUTPUT: ${{ runner.temp }}/fhf-pry07-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pry07-e2e
          path: ${{ runner.temp }}/fhf-pry07-evidence
          if-no-files-found: ignore
