name: Verificar proyecto
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: npm ci
      - name: Lint estricto, tipos, unitarias (citas y pacientes), integraciones y build
        run: npm run verify

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker pull postgres:17-alpine
      - run: python scripts/tar05/verify-database.py
        env:
          CONTAINER_ENGINE: docker

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Instalar Chromium de pruebas
        run: |
          npm install --prefix "$RUNNER_TEMP/fhf-playwright" --no-audit --no-fund playwright@1.65.1
          "$RUNNER_TEMP/fhf-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - run: python3 -m unittest discover -s scripts/pry07
      - name: E2E local de citas e historial clínico con Auth y PostgreSQL
        run: |
          set -o pipefail
          python3 -u scripts/pry07/local-e2e.py 2>&1 | tee "$RUNNER_TEMP/fhf-e2e.log"
        env:
          CONTAINER_ENGINE: docker
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/fhf-playwright/node_modules/playwright/index.mjs
          PRY07_E2E_OUTPUT: ${{ runner.temp }}/fhf-pry07-evidence
      - name: Publicar resumen E2E en anotaciones
        if: always()
        run: |
          log="$RUNNER_TEMP/fhf-e2e.log"
          if [ -f "$log" ]; then
            summary="$(grep -aE '^(POSTGRESQL|AUTH|BUILD|E2E|PASS|FAIL|SQL|CLEANUP|PRY07)' "$log" | tail -40 | paste -sd ';' -)"
            echo "::notice title=PRY07 E2E::${summary:-sin resultados}"
          else
            echo "::notice title=PRY07 E2E::sin log de ejecución"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pry07-e2e
          path: ${{ runner.temp }}/fhf-pry07-evidence
          if-no-files-found: ignore
